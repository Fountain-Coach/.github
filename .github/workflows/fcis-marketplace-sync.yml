name: FCIS Marketplace Release Verification

on:
  push:
    branches: [main]
    paths:
      - '.codex/skills/**'
      - 'skills/openai-distribution.json'
      - 'skills/plugin_projection.py'
      - 'skills/marketplace_publish.py'
      - 'plugins/fcis-skill-authoring-and-sync/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcis-marketplace-main
  cancel-in-progress: false

jobs:
  project:
    if: github.repository == 'Fountain-Coach/.github' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the canonical source and test the learning mechanism
        run: |
          python3 skills/skillctl.py check
          python3 -m unittest discover -s skills/tests -v
      - name: Verify all six canonical Skills already released in Git
        run: |
          python3 skills/plugin_projection.py check
          git diff --check
