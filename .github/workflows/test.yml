name: Test Suite
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the same owner-maintained POSIX source CI as Git hooks
        env:
          FCIS_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FCIS_CI_HEAD: ${{ github.sha }}
        run: sh scripts/fcis-ci.sh source
