name: Test Suite
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all canonical FCIS Skill digests
        run: python3 skills/skillctl.py check
      - name: Run organization source, learning and projection tests
        run: python3 -m unittest discover -s skills/tests -v
      - name: Validate changed file formatting
        run: git diff --check
