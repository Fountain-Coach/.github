interface:
  display_name: "FCIS Owner Access"
  short_description: "Maintain FCIS owner access and reasoning-readable OpenAPI 3.1/MCP capabilities."
  default_prompt: "Maintain the **one root-canonical `Fountain-Coach/.github/FCIS-OPENAPI.json`** alongside equal-authority `FCIS-STACK.md`, for the clean standalone Go issuer, owner Access and expressive internal OpenAPI 3.1. For operation authoring use stable meaningful operationId, summary and description explaining purpose, selection intent, negative use cases, required authorization, effects and evidence. Discover instrument identities and typed operations from admitted FCIS/MIDI2 Host contracts; reconcile HTTP fleet inventory and MCP tools/list with installed, admitted, routable and per-client callable states, rather than hardcoding host.describe. Keep the **root Go target HTTP OpenAPI** authoritative; current Swift routes are historical predecessor evidence only. Require actual Go source parity, scoped grants and native FountainStore terminal receipts before declaring any target operation callable; do not invent an admitted instrument, endpoint implementation or execution receipt. Preserve existing WebAuthn, OAuth and recovery policy under Governance 142, 152 and 161, and distinguish source from deployed and physically accepted behavior."
