interface:
  display_name: "FCIS Owner Access"
  short_description: "Maintain FCIS owner access and reasoning-readable OpenAPI 3.1/MCP capabilities."
  default_prompt: "Maintain the existing Fountain Coach owner Access, FCIS issuer and expressive internal OpenAPI 3.1. For operation authoring use stable meaningful operationId, summary and description explaining purpose, selection intent, negative use cases, required authorization, effects and evidence. Discover instrument identities and typed operations from admitted FCIS/MIDI2 Host contracts; reconcile HTTP fleet inventory and MCP tools/list with installed, admitted, routable and per-client callable states, rather than hardcoding host.describe. Keep real Swift routes, schemas, grants, FountainStore receipts and conformance tests authoritative; never invent an API, operation or execution receipt. Preserve existing WebAuthn, OAuth and recovery policy under Governance 142, 152 and 161, and distinguish source from deployed and physically accepted behavior."
