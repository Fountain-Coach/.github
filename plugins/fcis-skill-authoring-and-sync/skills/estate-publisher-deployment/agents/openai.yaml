interface:
  display_name: "EstatePublisher Deployment"
  short_description: "Deploy Fountain Press source-bound editions from canonical WLAN staging to authorized production using EstatePublisher."
  default_prompt: "For book publications, keep one source-authentic Fountain Press Linotype composition across canonical WLAN staging and public production. Preserve source rights, exact Git and artifact digests, chapter/link/media fidelity, any adopted agent-readable manifest/public guide parity, optional source-admitted artwork/social card (never mandatory for Governance), and rollback; activate only with EstatePublisher and separately authorized public HTTPS readback. For nonbook effects, select their current governed lane without inventing Store or agent prerequisites."
